[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "perfect-catalog"
version = "0.1.0"
description = "Importador controlado para Perfect Trading Catalog System"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]==3.3.4",
]

[project.scripts]
perfect-catalog = "perfect_catalog.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
